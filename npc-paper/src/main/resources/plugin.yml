name: simplecloud-npc
prefix: SimpleCloud-NPC
provides:
  - SimpleCloud-NPC
version: '${version}'
author: MrManHD
main: app.simplecloud.npc.plugin.paper.PaperPlugin
api-version: 1.21

libraries:
  - "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
  - "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
  - "org.jetbrains.kotlin:kotlin-reflect:2.4.0"

softdepend:
  - Citizens
  - FancyNpcs
  - MythicMobs
  - ZNPCsPlus

permissions:
  simplecloud.npcs.command:
    description: Manage SimpleCloud NPCs
    default: op
